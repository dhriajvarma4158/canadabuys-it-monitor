name: Daily CanadaBuys IT report

on:
  schedule:
    # 14:00 UTC ≈ 9–10am Eastern, after CanadaBuys refreshes the open-tenders
    # feed (07:00–08:30 UTC-0500). Adjust to taste.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days of new notices to include"
        required: false
        default: "1"

permissions:
  contents: write   # allows committing the report back into the repo (optional)
  id-token: write    # allows OIDC auth to AWS for optional S3 publishing

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        id: gen
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
          OUTPUT_DIR: reports
          SEND_EMAIL: "false"
          # Optional email. Leave SEND_EMAIL false for web-only publishing.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python canadabuys_monitor.py

      - name: Configure AWS credentials
        if: ${{ env.S3_BUCKET != '' && env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish static site to S3
        if: ${{ env.S3_BUCKET != '' && env.AWS_ROLE_TO_ASSUME != '' }}
        run: aws s3 sync reports/ "s3://${S3_BUCKET}/" --cache-control "no-cache"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: canadabuys-it-report
          path: reports/
          retention-days: 30

      - name: Commit report to repo (optional history)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "CanadaBuys IT report ${{ github.run_id }}" || echo "nothing to commit"
          git push || echo "push skipped"
