name: Daily CanadaBuys IT report

on:
  schedule:
    # 14:00 UTC ≈ 9–10am Eastern, after CanadaBuys refreshes the open-tenders
    # feed (07:00–08:30 UTC-0500). Adjust to taste.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days of new notices to include"
        required: false
        default: "1"

permissions:
  contents: write   # allows committing the report back into the repo (optional)

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        id: gen
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
          OUTPUT_DIR: reports
          # Email secrets — set these in repo Settings → Secrets and variables → Actions.
          # If left unset, the email step is skipped and the report is still uploaded.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python canadabuys_monitor.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: canadabuys-it-report
          path: reports/
          retention-days: 30

      - name: Commit report to repo (optional history)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "CanadaBuys IT report ${{ github.run_id }}" || echo "nothing to commit"
          git push || echo "push skipped"
